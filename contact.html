
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact me about my work, projects and technical interests.">
    <title>Contact Me | My Portfolio</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header>
    <nav class="navbar" aria-label="Main navigation">
        <a href="index.html" class="logo">MyPortfolio</a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="interests.html">Interests</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="page-container">

    <section class="page-heading">
        <p class="eyebrow">Let's connect</p>
        <h1>Contact Me</h1>

        <p>
            Have a question or want to discuss a project?
            You can use the form below to prepare a message.
        </p>
    </section>

    <section class="content-card contact-card">

        <form id="contactForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                    minlength="2"
                    placeholder="Enter your full name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    placeholder="Enter your email address"
                >
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    required
                    placeholder="Enter the subject"
                >
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                    minlength="10"
                    placeholder="Write your message here"
                ></textarea>
            </div>

            <button type="submit" class="btn">
                Prepare Message
            </button>

            <p
                id="formFeedback"
                role="status"
                aria-live="polite"
            ></p>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 Umair Mirza. All rights reserved.</p>
</footer>

<script src="assets/js/main.js"></script>

</body>
</html>
